Syntax 3

SectionUseCase."HiFi" {
	File "/Xiaomi/whyred/HiFi.conf"
	Comment "HiFi audio (whyred / SDM660)"
}

# Safe defaults at card init.  Route enabling is done by the device
# EnableSequence so the microphone stays off until it is actually used.
BootSequence [
	cset "name='Speaker Playback Volume' 8"
	cset "name='EAR_S' ZERO"
	cset "name='LPI_MI2S_RX_0 Audio Mixer MultiMedia1' 0"
	cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	cset "name='ADC1 Volume' 8"
	cset "name='Digital CIC1 MUX' AMIC"
]
