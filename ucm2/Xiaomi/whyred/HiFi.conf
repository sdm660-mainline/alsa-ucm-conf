SectionVerb {
	EnableSequence [
	]

	DisableSequence [
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Built-in Speaker (TAS2557 smart amplifier)"

	ConflictingDevice [
		"Earpiece"
	]

	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackCTL "hw:0"
		PlaybackPCM "hw:0,0"
		PlaybackPriority 300
		PlaybackChannels 2
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece (PM660L EAR)"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='LPI_MI2S_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='EAR_S' Switch"
	]

	DisableSequence [
		cset "name='LPI_MI2S_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='EAR_S' ZERO"
	]

	Value {
		PlaybackCTL "hw:0"
		PlaybackPCM "hw:0,0"
		PlaybackPriority 200
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Built-in Microphone (PMIC ADC1 / AMIC1)"

	EnableSequence [
		cset "name='MultiMedia2 Mixer LPI_MI2S_TX_3' 1"
		cset "name='Digital CIC1 MUX' AMIC"
		cset "name='Digital DEC1 MUX' ADC1"
		cset "name='ADC1 Volume' 8"
	]

	DisableSequence [
		cset "name='MultiMedia2 Mixer LPI_MI2S_TX_3' 0"
		cset "name='Digital DEC1 MUX' ZERO"
	]

	Value {
		CaptureCTL "hw:0"
		CapturePCM "hw:0,1"
		CapturePriority 100
		CaptureChannels 1
	}
}
