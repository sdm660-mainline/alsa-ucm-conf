Syntax 3

SectionUseCase."HiFi" {
	File "/Xiaomi/jasmine/HiFi.conf"
	Comment "HiFi audio"
}

# Volume defaults should be declared in the boot sequence so they can be
# overriden by the user.
BootSequence [
	# Earpiece
	cset "name='Digital RX1 Digital Volume' 84"

	# Speaker (TAS2557) — DAC gain 0..15 dB, 1 dB/step; 14 = +14 dB
	cset "name='Speaker Playback Volume' 14"
]
