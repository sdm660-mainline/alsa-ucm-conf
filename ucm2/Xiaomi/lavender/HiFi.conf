SectionVerb {
	EnableSequence [
		cset "name='LPI_MI2S_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer LPI_MI2S_TX_3' 1"
	]

	DisableSequence [
		cset "name='LPI_MI2S_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer LPI_MI2S_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Earpiece" {
	Comment "Built-in Earpiece"

	EnableSequence [
		cset "name='Digital RX1 MIX1 INP1' RX1"
		cset "name='EAR_S' Switch"
	]

	DisableSequence [
		cset "name='Digital RX1 MIX1 INP1' ZERO"
		cset "name='EAR_S' ZERO"
	]

	ConflictingDevices [
		"Speaker"
		"Headphones"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 100
	}
}

SectionDevice."Mic" {
	Comment "Built-in Microphone"

	EnableSequence [
		cset "name='Digital CIC1 MUX' AMIC"
		cset "name='Digital DEC1 MUX' ADC1"
	]

	DisableSequence [
		cset "name='Digital DEC1 MUX' ZERO"
	]

	ConflictingDevices [
		"Headset Mic"
	]

	Value {
		CapturePCM "hw:${CardId},1"
		CapturePriority 100
		CaptureChannels 1
	}
}

SectionDevice."Headphones" {
	Comment "Headphones (3.5 mm jack)"

	EnableSequence [
		cset "name='Digital RX1 MIX1 INP1' RX1"
		cset "name='Digital RX2 MIX1 INP1' RX2"
		cset "name='HPHL' Switch"
		cset "name='HPHR' Switch"
	]

	DisableSequence [
		cset "name='Digital RX1 MIX1 INP1' ZERO"
		cset "name='Digital RX2 MIX1 INP1' ZERO"
		cset "name='HPHL' ZERO"
		cset "name='HPHR' ZERO"
	]

	ConflictingDevices [
		"Speaker"
		"Earpiece"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 200
		JackControl "Headset Jack"
	}
}

SectionDevice."Headset Mic" {
	Comment "Headset Microphone"

	EnableSequence [
		cset "name='Digital CIC1 MUX' AMIC"
		cset "name='Digital DEC1 MUX' ADC2"
		cset "name='ADC2 MUX' INP2"
	]

	DisableSequence [
		cset "name='Digital DEC1 MUX' ZERO"
		cset "name='ADC2 MUX' ZERO"
	]

	ConflictingDevices [
		"Microphone"
	]

	Value {
		CapturePCM "hw:${CardId},1"
		CapturePriority 200
		CaptureChannels 1
		JackControl "Headset Jack"
	}
}

# q6routing keeps a single port per session, and turning off the last route
# of a session leaves it without a port. So one route always stays on:
# LPI_MI2S_RX_0 from the verb, swapped for PRI while the speaker is active.
SectionDevice."Speaker" {
	Comment "Built-in Speaker"

	EnableSequence [
		cset "name='LPI_MI2S_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='LPI_MI2S_RX_0 Audio Mixer MultiMedia1' 1"
	]

	ConflictingDevices [
		"Earpiece"
		"Headphones"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 150
	}
}
